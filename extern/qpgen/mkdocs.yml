site_name: qpgen
site_url: https://hyunminkang.github.io/qpgen/

# Repository
repo_name: hyunminkang/qpgen
repo_url: https://github.com/hyunminkang/qpgen

theme: 
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    # - announce.dismiss
    # - content.action.edit
    # - content.action.view
    # - content.code.annotate
    # - content.code.copy
    # - content.tooltips
    # - navigation.footer
    # - navigation.top
    # - navigation.tracking
    # - search.highlight
    # - search.share
    # - search.suggest
    # - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference

# Plugins
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Install: install.md
  - Formats:
    - Genotypes: formats/genotypes.md
    - Phenotypes: formats/phenotypes.md
  - Tools: 
    - Introduction: tools.md
    - pair-assoc: tools/pair_assoc.md
    - pair-prs: tools/pair_prs.md
    - rect-assoc: tools/rect_assoc.md
    - region-assoc: tools/region_assoc.md
    - match-prs-pheno: tools/match_prs_pheno.md
    - match-prs-pheno methods: tools/match_prs_pheno_methods.md
    - match-plp-geno: tools/match_plp_geno.md
    - join-plp-geno: tools/join_plp_geno.md
    - geno2tsv: tools/geno2tsv.md
    - pgen2tsv: tools/pgen2tsv.md
  
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  # - abbr
  - attr_list
  # - def_list
  - footnotes
  # - md_in_html
  - toc:
      permalink: true
  ## MathJax expression support
  - pymdownx.arithmatex:
      generic: true
  ## Improved detection of Markup 
  - pymdownx.betterem:
      smart_enable: all
  ## Highight text and define sub- and superscript
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  ## Collapsible blocks
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  # - pymdownx.highlight:
  #     anchor_linenums: true
  #     line_spans: __span
  #     pygments_lang_class: true
  # - pymdownx.inlinehilite
  # - pymdownx.keys
  # - pymdownx.magiclink:
  #     normalize_issue_symbols: true
  #     repo_url_shorthand: true
  #     user: squidfunk
  #     repo: mkdocs-material
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # - pymdownx.tasklist:
  #     custom_checkbox: true
