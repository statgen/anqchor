site_name: anqchor
site_description: Genetically anchored quality control for large-scale multi-omics xQTL analysis
site_url: https://hyunminkang.github.io/anqchor/

repo_name: statgen/anqchor
repo_url: https://github.com/statgen/anqchor
edit_uri: ""

copyright: Copyright &copy; 2026 Hyun Min Kang and contributors. Apache-2.0.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Use cases:
      - use-cases/index.md
      - Example data: use-cases/example-data.md
      - Sample identity: use-cases/identity-matching.md
      - Comparing cis runs: use-cases/cis-strategies.md
      - trans evaluation: use-cases/trans-strategies.md
  - User guide:
      - Concepts: user-guide/concepts.md
      - Inputs: user-guide/inputs.md
      - Configuration: user-guide/configuration.md
      - Running: user-guide/running.md
  - Pipelines:
      - match (sample identity): pipelines/match.md
      - cis (replication of known pairs): pipelines/cis.md
      - trans (replication, hotspots, inflation): pipelines/trans.md
  - Reference:
      - Command line: reference/cli.md
      - Output files: reference/outputs.md
      - qpgen integration: reference/qpgen.md
      - Python API: reference/python-api.md
  - Development: development.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
